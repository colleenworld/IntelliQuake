name: intelliquake

x-application: &application
  image: intelliquake-app:lightsail
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  env_file:
    - .env.production
  environment:
    NODE_ENV: production
    API_HOST: 0.0.0.0
    API_PORT: 3000
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    DATABASE_SSL: 'false'
    RAW_OBJECT_DIRECTORY: /workspace/.local/raw
    DB_MIGRATIONS_DIR: /workspace/database/migrations
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - backend

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  api:
    <<: *application
    restart: unless-stopped
    command: ['node', 'apps/api/dist/main.js']
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - frontend
      - backend

  jobs:
    <<: *application
    profiles:
      - jobs
    command: ['node', 'apps/ingestion/dist/cli/poll.js']
    volumes:
      - raw_data:/workspace/.local/raw
    networks:
      - frontend
      - backend
  web:
    image: intelliquake-web:lightsail
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres_data:
  raw_data:
  caddy_data:
  caddy_config:
